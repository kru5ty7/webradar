name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Build frontend
        run: cd webapp && npm install && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyinstaller websockets pywebview Pillow lz4 vpk

      - name: Stamp version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          "VERSION = `"$env:TAG`"" | Out-File -FilePath helper/windows/src/version.py -Encoding utf8NoBOM

      # The Windows exe comes from the Windows-only fork, which carries the
      # Windows fixes; the Linux binary below still builds from helper/linux.
      - name: Build exe
        run: cd helper/windows && pyinstaller radar.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: helper/windows/dist/cs2-webradar.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Build frontend
        run: cd webapp && npm install && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        # No pywebview / PyGObject / GTK here: the overlay windows are not part of the
        # prebuilt Linux binary (see helper/linux/radar.spec), which keeps it ~16 MB.
        run: pip install pyinstaller websockets Pillow lz4 vpk

      - name: Stamp version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "VERSION = \"$TAG\"" > helper/linux/src/version.py

      - name: Build binary
        run: cd helper/linux && pyinstaller radar.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: helper/linux/dist/cs2-radar-linux
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cs2-webradar.exe
            dist/cs2-radar-linux
          generate_release_notes: true
          fail_on_unmatched_files: true
