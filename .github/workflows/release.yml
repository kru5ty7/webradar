name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Build frontend
        run: |
          cd webapp
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyinstaller websockets pywebview

      - name: Stamp version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          "VERSION = `"$tag`"" | Out-File -FilePath ai_agent_helper/version.py -Encoding utf8NoBOM

      - name: Build exe
        run: |
          cd ai_agent_helper
          pyinstaller radar.spec --noconfirm

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai_agent_helper/dist/GameOverlayService.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
